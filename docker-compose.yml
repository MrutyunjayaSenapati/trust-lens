services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    volumes:
      - trustlens-cache:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]
    restart: unless-stopped

volumes:
  trustlens-cache:
